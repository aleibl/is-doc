[defaults]
# Inventory configuration
inventory = inventory/hosts.yml
host_key_checking = False

# Output configuration
stdout_callback = default
bin_ansible_callbacks = True

# Vault configuration
# Note: For AAP, use AAP's credential system instead of vault_password_file
# For CLI with vault, use --ask-vault-pass or set ANSIBLE_VAULT_PASSWORD_FILE env var
# vault_password_file = .vault_pass

# Connection settings
timeout = 30
gathering = explicit

# Privilege escalation
become = False

# Logging
log_path = ./ansible.log

[inventory]
enable_plugins = yaml, ini

[privilege_escalation]
become = False
---
# ============================================================================
# IBM Power Systems Infrastructure Collection Playbook (AAP Optimized)
# ============================================================================
#
# This is an AAP-optimized version that works around inventory parsing issues
# by using AAP's inventory directly without relying on inventory files.
#
# Usage in AAP:
#   - Create job template pointing to this playbook
#   - Configure inventory in AAP UI
#   - Run job template
#
# This playbook is identical to collect_infrastructure.yml but optimized
# for AAP execution environments.
# ============================================================================

- name: Collect IBM Power Systems Infrastructure Information (AAP)
  hosts: all
  gather_facts: true
  
  vars:
    project_version: "{{ lookup('file', 'VERSION') | trim }}"
    collection_timestamp: "{{ ansible_date_time.iso8601 }}"
    report_timestamp: "{{ ansible_date_time.date }}_{{ ansible_date_time.time | replace(':', '-') }}"
    hmc_protocol: "https"
    hmc_base_url: "{{ hmc_protocol }}://{{ ansible_host | default(inventory_hostname) }}:{{ hmc_port | default(12443) }}"
    # Set defaults for AAP
    hmc_port: "{{ hmc_port | default(12443) }}"
    hmc_validate_certs: "{{ hmc_validate_certs | default(false) }}"
    output_dir: "{{ output_dir | default('./output/reports') }}"
    
  tasks:
    # ============================================
    # Environment Detection & Credential Setup
    # ============================================
    - name: Set AAP environment flag
      ansible.builtin.set_fact:
        is_aap_environment: true
      
    - name: Display execution information
      ansible.builtin.debug:
        msg:
          - "Playbook: AAP-optimized version"
          - "Execution environment: AAP"
          - "Host: {{ inventory_hostname }}"
          - "ansible_host: {{ ansible_host | default('not set') }}"
          - "Timestamp: {{ collection_timestamp }}"

    - name: Use AAP credentials
      ansible.builtin.set_fact:
        hmc_username: "{{ lookup('env', 'HMC_USERNAME') | default(lookup('env', 'ANSIBLE_NET_USERNAME')) | default(hmc_username | default('')) }}"
        hmc_password: "{{ lookup('env', 'HMC_PASSWORD') | default(lookup('env', 'ANSIBLE_NET_PASSWORD')) | default(hmc_password | default('')) }}"
      no_log: true

    - name: Verify credentials are available
      ansible.builtin.assert:
        that:
          - hmc_username | length > 0
          - hmc_password | length > 0
        fail_msg: "HMC credentials not found. Ensure credential is attached to job template."
        success_msg: "HMC credentials loaded successfully"

    # ============================================
    # Pre-flight checks
    # ============================================
    - name: Ensure output directory exists
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true

    # ============================================
    # HMC Authentication
    # ============================================
    - name: Authenticate to HMC REST API
      ansible.builtin.uri:
        url: "{{ hmc_base_url }}/rest/api/web/Logon"
        method: PUT
        user: "{{ hmc_username }}"
        password: "{{ hmc_password }}"
        force_basic_auth: true
        validate_certs: "{{ hmc_validate_certs }}"
        return_content: yes
        status_code: [200, 204]
      register: hmc_session
      no_log: true

    - name: Extract session token
      ansible.builtin.set_fact:
        hmc_session_token: "{{ hmc_session.x_api_session }}"
      no_log: true

    # ============================================
    # Collect Managed Systems
    # ============================================
    - name: Collect managed systems from HMC
      ansible.builtin.uri:
        url: "{{ hmc_base_url }}/rest/api/uom/ManagedSystem"
        method: GET
        headers:
          X-API-Session: "{{ hmc_session_token }}"
          Accept: "{{ hmc_accept_type | default('application/vnd.ibm.powervm.uom+xml') }}"
        validate_certs: "{{ hmc_validate_certs }}"
        return_content: yes
      register: managed_systems_response

    - name: Parse managed systems XML
      ansible.builtin.set_fact:
        managed_systems_xml: "{{ managed_systems_response.content }}"

    - name: Extract managed system information
      ansible.builtin.set_fact:
        systems: "{{ managed_systems_xml | regex_findall('<ManagedSystem[^>]*>.*?</ManagedSystem>', multiline=True) | map('regex_replace', '<SystemName>(.*?)</SystemName>.*', '\\1') | list }}"

    - name: Display collected systems
      ansible.builtin.debug:
        msg: "Found {{ systems | length }} managed systems"

    # ============================================
    # Collect LPARs (simplified for testing)
    # ============================================
    - name: Initialize infrastructure data
      ansible.builtin.set_fact:
        infrastructure_data:
          collection_info:
            timestamp: "{{ collection_timestamp }}"
            hmc: "{{ inventory_hostname }}"
            version: "{{ project_version }}"
          systems: []

    # ============================================
    # Generate Reports
    # ============================================
    - name: Generate JSON report
      ansible.builtin.copy:
        content: "{{ infrastructure_data | to_nice_json }}"
        dest: "{{ output_dir }}/infrastructure_{{ report_timestamp }}.json"
      delegate_to: localhost

    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "Collection completed successfully"
          - "Report generated: infrastructure_{{ report_timestamp }}.json"

    # ============================================
    # Persist Reports (AAP Artifacts)
    # ============================================
    - name: Register AAP artifacts
      ansible.builtin.set_stats:
        data:
          infrastructure_report_json: "{{ infrastructure_data | to_json }}"
        per_host: false
      when: is_aap_environment | default(false)

    # ============================================
    # Cleanup
    # ============================================
    - name: Logout from HMC
      ansible.builtin.uri:
        url: "{{ hmc_base_url }}/rest/api/web/Logon"
        method: DELETE
        headers:
          X-API-Session: "{{ hmc_session_token }}"
        validate_certs: "{{ hmc_validate_certs }}"
        status_code: [200, 204]
      no_log: true
      ignore_errors: yes